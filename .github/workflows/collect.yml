name: collect

on:
  schedule:
    # Hourly on weekdays, 14:35 to 21:35 UTC. This covers the US cash session
    # in both winter and summer time. The script skips runs when the market
    # has not traded today.
    - cron: "35 14-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python collector.py
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Add snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
